<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paithosh — Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --win-bg: #0b0b0c;
      --sidebar-bg: #101012;
      --card-bg: rgba(255, 255, 255, 0.055);
      --card-hover: rgba(255, 255, 255, 0.095);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
      --accent: #ffffff;
      --spring: cubic-bezier(0.34, 1.35, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Open Sans", system-ui, -apple-system, sans-serif;
      background: #0b0b0c;
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }

    /* Frameless Window matching Settings */
    .window {
      width: 100%;
      height: 100%;
      background: var(--win-bg);
      display: flex;
      overflow: hidden;
      animation: winIn 0.45s var(--spring) both;
    }

    @keyframes winIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Left Sidebar matching Settings */
    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.22s var(--spring);
    }

    .profile:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .profile:active {
      transform: scale(0.98);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #8e8e93 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      flex-shrink: 0;
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-sub {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 8px 34px 8px 12px;
      outline: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      right: 10px;
      color: var(--text-sub);
      pointer-events: none;
      display: flex;
    }

    /* Tree Navigation */
    .nav-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .nav-list::-webkit-scrollbar,
    .file-area::-webkit-scrollbar {
      width: 5px;
    }

    .nav-list::-webkit-scrollbar-thumb,
    .file-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
    }

    .nav-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 18px;
      border-radius: 999px;
      background: var(--accent);
      transition: transform 0.34s var(--spring);
      pointer-events: none;
      z-index: 2;
    }

    .nav-item {
      font-family: inherit;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      opacity: 0.85;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
      outline: none;
      overflow: hidden;
      flex-shrink: 0;
      transition: background 0.18s ease, transform 0.2s var(--spring), color 0.18s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-item:active {
      transform: scale(0.97);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.09);
      font-weight: 600;
      color: #ffffff;
    }

    .nav-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .nav-icon {
      width: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tree-group {
      display: flex;
      flex-direction: column;
    }

    .nav-item .tree-chevron {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-sub);
      transition: transform 0.28s var(--spring);
      flex-shrink: 0;
    }

    .tree-group.is-open > .nav-item .tree-chevron {
      transform: rotate(90deg);
    }

    .tree-children {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 18px;
      margin-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-4px);
      transition:
        max-height 0.34s var(--smooth),
        opacity 0.26s ease,
        transform 0.32s var(--spring),
        margin 0.3s var(--smooth);
    }

    .tree-group.is-open > .tree-children {
      max-height: 260px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 2px;
      margin-bottom: 4px;
    }

    .nav-sub {
      padding: 7px 10px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.68);
    }

    /* Bottom-left Transfer Status Card */
    .transfer-box {
      margin-top: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow: hidden;
      flex-shrink: 0;
      max-height: 90px;
      opacity: 1;
      transition:
        opacity 0.26s var(--smooth),
        max-height 0.3s var(--smooth),
        padding 0.3s var(--smooth),
        transform 0.3s var(--spring);
    }

    .transfer-box.is-hidden {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      transform: translateY(6px) scale(0.96);
      pointer-events: none;
    }

    .transfer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .transfer-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .transfer-pct {
      color: var(--text-sub);
      font-weight: 400;
      flex-shrink: 0;
    }

    .transfer-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .transfer-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.22s linear;
    }

    .transfer-sub {
      font-size: 10px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Integrated Archiver Banner inside File Manager */
    .archiver-bar {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      animation: itemIn 0.28s var(--spring) both;
    }

    .archiver-bar.is-open { display: flex; }

    .archiver-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .archiver-title { font-size: 13px; font-weight: 700; color: #fff; }
    .archiver-sub { font-size: 11px; color: var(--text-sub); }
    .archiver-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* Right Content Pane matching Settings */
    .content {
      flex: 1;
      min-width: 0;
      padding: 26px 34px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .breadcrumb {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      padding: 4px 10px;
      margin-left: -10px;
      border-radius: 10px;
      cursor: text;
      transition: background 0.18s ease;
    }

    .breadcrumb:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .breadcrumb span {
      color: var(--text-sub);
      font-weight: 400;
    }

    .path-edit-input {
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-bottom: 2px solid #ffffff;
      border-radius: 10px;
      padding: 6px 12px;
      outline: none;
      width: 360px;
      max-width: 100%;
      animation: itemIn 0.22s var(--spring) both;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.22s var(--spring), color 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .icon-btn:active {
      transform: scale(0.88);
    }

    .icon-btn.active {
      background: var(--card-bg);
      border-color: var(--border);
      color: #ffffff;
    }

    /* File Grid / List */
    .file-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      position: relative;
    }

    .virtual-spacer {
      position: relative;
      width: 100%;
    }

    .file-grid {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .scroll-pill {
      position: absolute;
      right: 14px;
      bottom: 14px;
      background: rgba(18, 18, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px) scale(0.95);
      transition: opacity 0.22s ease, transform 0.24s var(--spring);
      z-index: 10;
    }

    .scroll-pill.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .file-grid.is-list {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .file-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.24s var(--spring);
      animation: itemIn 0.34s var(--spring) both;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .file-card:hover {
      background: var(--card-hover);
      transform: translateY(-1px);
    }

    .file-card:active {
      transform: scale(0.96);
    }

    .file-card.selected {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .file-card.drop-target {
      background: rgba(255, 255, 255, 0.18);
      border-color: #ffffff;
      transform: scale(1.04);
    }

    .file-card.is-removing {
      opacity: 0;
      transform: scale(0.84);
      pointer-events: none;
    }

    .file-grid.is-list .file-card.is-removing {
      transform: translateX(22px) scale(0.96);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      border-width: 0;
    }

    .rename-input {
      width: 100%;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 6px;
      padding: 2px 6px;
      text-align: center;
      outline: none;
    }

    .file-grid.is-list .rename-input {
      text-align: left;
    }

    .action-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      max-width: 0;
      opacity: 0;
      transform: translateX(8px);
      transition:
        max-width 0.36s var(--smooth),
        opacity 0.24s ease,
        transform 0.34s var(--spring);
    }

    .action-pills.is-visible {
      max-width: 320px;
      opacity: 1;
      transform: translateX(0);
    }

    .pill-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s ease, transform 0.22s var(--spring);
    }

    .pill-btn:hover {
      background: var(--card-hover);
    }

    .pill-btn:active {
      transform: scale(0.92);
    }

    .pill-btn.danger {
      color: #ff6961;
    }

    /* Compact Monochrome Context Menu */
    .ctx-menu {
      position: fixed;
      width: 184px;
      background: #121214;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92) translateY(-4px);
      transform-origin: top left;
      transition: opacity 0.18s ease, transform 0.24s var(--spring);
    }

    .ctx-menu.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    .ctx-item {
      font-family: inherit;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, transform 0.18s var(--spring), color 0.15s ease;
    }

    .ctx-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .ctx-item:active {
      transform: scale(0.96);
    }

    .ctx-item.danger {
      color: #ff6961;
    }

    .ctx-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 3px 4px;
    }

    /* Monochrome Input / Password Dialog inside File Manager */
    .pwd-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .pwd-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .pwd-card {
      width: 340px;
      max-width: calc(100vw - 32px);
      background: #101012;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: scale(0.92) translateY(8px);
      transition: transform 0.3s var(--spring);
    }

    .pwd-backdrop.is-open .pwd-card {
      transform: scale(1) translateY(0);
    }

    .pwd-card.is-shake {
      animation: pwdShake 0.32s ease;
    }

    @keyframes pwdShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .pwd-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 2px solid rgba(255, 255, 255, 0.28);
      border-radius: 9px;
      padding: 6px 10px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .pwd-input-wrap:focus-within {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-color: #ffffff;
    }

    .pwd-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
    }

    .pwd-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      opacity: 0.9;
      flex-shrink: 0;
    }

    .file-name {
      width: 100%;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-sub {
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* List View Overrides */
    .file-grid.is-list .file-card {
      flex-direction: row;
      padding: 12px 16px;
      gap: 14px;
    }

    .file-grid.is-list .file-icon {
      width: 24px;
      height: 24px;
    }

    .file-grid.is-list .file-icon svg {
      width: 20px;
      height: 20px;
    }

    .file-grid.is-list .file-name {
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .file-grid.is-list .file-sub {
      width: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      padding-top: 8px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Portal Location Picker Dialog (Inherits File Manager Design) */
    .picker-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 60;
    }

    .picker-backdrop.is-open {
      display: flex;
    }

    .picker-window {
      width: min(820px, 100%);
      height: min(500px, calc(100vh - 36px));
      background: var(--win-bg);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.97) translateY(6px);
      transition: transform 0.24s var(--spring);
    }

    .picker-backdrop.is-open .picker-window {
      transform: scale(1) translateY(0);
    }

    .picker-head {
      height: 40px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .picker-mode-pill {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 9px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .picker-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;

        { name: "etc", type: "folder", meta: "Configs" },
        { name: "home", type: "folder", meta: "Users" },
        { name: "usr", type: "folder", meta: "Programs" },
        { name: "var", type: "folder", meta: "Logs" }
      ],
      Archive1000: Array.from({ length: 1000 }, (_, i) => {
        const types = ["code", "file", "archive", "folder"];
        const exts = [".ts", ".md", ".zip", ""];
        const t = types[i % 4];
        const num = String(i + 1).padStart(4, "0");
        return {
          name: t === "folder" ? `module-${num}` : `asset-${num}${exts[i % 4]}`,
          type: t,
          meta: t === "folder" ? `${(i % 12) + 2} items` : `${((i % 90) + 10)} KB`
        };
      })
    };

    const fileArea = document.getElementById("fileArea");
    const virtualSpacer = document.getElementById("virtualSpacer");
    const scrollPill = document.getElementById("scrollPill");
    const fileGrid = document.getElementById("fileGrid");
    const breadcrumb = document.getElementById("breadcrumb");
    const statusLeft = document.getElementById("statusLeft");
    const searchInput = document.getElementById("searchInput");
    const navList = document.getElementById("navList");
    const indicator = document.getElementById("navIndicator");
    const navItems = document.querySelectorAll(".nav-item");

    let currentDir = "Home";
    let historyStack = ["Home"];
    let historyIdx = 0;
    let selectedName = null;
    const selectedSet = new Set();
    let lastAnchorName = null;

    function captureRects() {
      const map = new Map();
      fileGrid.querySelectorAll(".file-card:not([data-ghost])").forEach(el => {
        map.set(el.dataset.name, el.getBoundingClientRect());
      });
      return map;
    }

    function animateFlip(oldRects) {
      const isList = fileGrid.classList.contains("is-list");
      const moved = [];
      const newlyEntered = [];
      let fallbackDy = 0;

      fileGrid.querySelectorAll(".file-card:not([data-ghost])").forEach(el => {
        const oldR = oldRects.get(el.dataset.name);
        if (!oldR) {
          newlyEntered.push(el);
          return;
        }
        const newR = el.getBoundingClientRect();
        const dx = oldR.left - newR.left;
        const dy = oldR.top - newR.top;
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
        if (dy > 0) fallbackDy = dy;
        el.style.animation = "none";
        el.style.transition = "none";
        el.style.position = "relative";
        el.style.zIndex = "2";
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        moved.push(el);
      });

      // Newly revealed items from below viewport slide up smoothly with the rest of the list
      if (isList && fallbackDy > 0) {
        newlyEntered.forEach(el => {
          el.style.animation = "none";
          el.style.transition = "none";
          el.style.position = "relative";
          el.style.zIndex = "2";
          el.style.opacity = "0";
          el.style.transform = `translate(0, ${fallbackDy}px)`;
          moved.push(el);
        });
      }

      if (moved.length === 0) return;
      void fileGrid.offsetHeight;

      const ease = isList ? "var(--smooth)" : "var(--spring)";
      const dur = isList ? "0.38s" : "0.44s";
      moved.forEach((el, idx) => {
        const delay = isList ? Math.min(idx * 12, 84) : Math.min(idx * 8, 64);
        el.style.transition = `transform ${dur} ${ease} ${delay}ms, opacity 0.24s ease ${delay}ms`;
        el.style.transform = "translate(0, 0)";
        el.style.opacity = "1";
        setTimeout(() => {
          el.style.transition = "";
          el.style.transform = "";
          el.style.opacity = "";
          el.style.position = "";
          el.style.zIndex = "";
        }, 540);
      });
    }

    function updateActionBar() {
      const pills = document.getElementById("actionPills");
      const count = selectedSet.size;
      if (pills) pills.classList.toggle("is-visible", count > 0);
      const renameBtn = document.getElementById("renameBtn");
      const moveBtn = document.getElementById("moveBtn");
      const delBtn = document.getElementById("deleteBtn");
      if (renameBtn) renameBtn.style.display = count === 1 ? "" : "none";
      if (moveBtn) moveBtn.textContent = count > 1 ? `Move (${count}) → Dev` : "Move → Dev";
      if (delBtn) delBtn.textContent = count > 1 ? `Delete (${count})` : "Delete";
    }

    let indRafId = null;

    function updateIndicator(activeBtn) {
      if (!activeBtn || !navList) return;
      const listRect = navList.getBoundingClientRect();
      const btnRect = activeBtn.getBoundingClientRect();
      const x = btnRect.left - listRect.left;
      const y = btnRect.top - listRect.top + navList.scrollTop + (btnRect.height - 18) / 2;
      indicator.style.transform = `translate(${x}px, ${y}px)`;
    }

    function trackIndicatorDuringTree(activeBtn) {
      if (indRafId) cancelAnimationFrame(indRafId);
      const start = performance.now();
      function tick(now) {
        updateIndicator(activeBtn);
        if (now - start < 380) indRafId = requestAnimationFrame(tick);
      }
      indRafId = requestAnimationFrame(tick);
    }

    const DIR_PATHS = {
      Home: "~",
      Documents: "~/Documents",
      Dev: "~/Dev",
      Music: "~/Music",
      Pictures: "~/Pictures",
      Downloads: "~/Downloads",
      Archive1000: "~/Dataset",
      Recent: "~/Recent",
      Starred: "~/Starred",
      Trash: "~/.local/share/Trash",
      "/": "/"
    };

    function getDirPath(dir) {
      return DIR_PATHS[dir] || `~/${dir}`;
    }

    function formatBreadcrumb(pathStr) {
      if (pathStr === "/") return "<span>/ › </span>Root";
      if (pathStr === "~") return "<span>/home/</span>paithon";
      const parts = pathStr.split("/").filter(Boolean);
      const last = parts.pop();
      const prefix = parts.join(" › ");
      return prefix ? `<span>${prefix} › </span>${last}` : last;
    }

    function openPathEditor() {
      if (document.getElementById("pathEditInput")) return;
      const input = document.createElement("input");
      input.id = "pathEditInput";
      input.className = "path-edit-input";
      input.value = getDirPath(currentDir);
      breadcrumb.replaceWith(input);
      input.focus();
      input.select();

      let closed = false;
      const restore = () => {
        if (closed) return;
        closed = true;
        if (input.parentNode) input.replaceWith(breadcrumb);
      };

      const commit = () => {
        const raw = input.value.trim();
        restore();
        if (!raw) return;
        if (raw === "/" || raw.toLowerCase() === "root") {
          navigateTo("/");
          return;
        }
        if (raw === "~" || raw === "/home/paithon" || raw.toLowerCase() === "home") {
          navigateTo("Home");
          return;
        }
        const cleaned = raw.replace(/^~\/?/, "").replace(/^\/+/, "");
        const matchKey = Object.keys(FS).find(
          k => k.toLowerCase() === cleaned.toLowerCase() || getDirPath(k).toLowerCase() === raw.toLowerCase()
        );
        if (matchKey) {
          navigateTo(matchKey);
        } else {
          statusLeft.textContent = `Path not found: ${raw}`;
        }
      };

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") restore();
      });
      input.addEventListener("blur", restore);
    }

    breadcrumb.addEventListener("click", openPathEditor);

    let currentVisibleItems = [];
    let scrollPillTimer = null;

    function getVirtualMetrics() {
      const isList = fileGrid.classList.contains("is-list");
      const areaW = fileArea.clientWidth - 4;
      const cols = isList ? 1 : Math.max(1, Math.floor((areaW + 10) / 150));
      const rowH = isList ? 54 : 124;
      return { isList, cols, rowH };
    }

    function renderVirtualWindow(useFlip = false, preRects = null) {
      const oldRects = preRects || (useFlip ? captureRects() : null);
      const { cols, rowH } = getVirtualMetrics();
      const total = currentVisibleItems.length;
      const totalRows = Math.ceil(total / cols);
      virtualSpacer.style.height = totalRows * rowH + "px";

      const scrollTop = fileArea.scrollTop;
      const viewH = fileArea.clientHeight || 500;
      const startRow = Math.max(0, Math.floor(scrollTop / rowH) - 1);
      const endRow = Math.min(totalRows, Math.ceil((scrollTop + viewH) / rowH) + 2);
      const startIdx = startRow * cols;
      const endIdx = Math.min(total, endRow * cols);

      fileGrid.style.top = startRow * rowH + "px";
      fileGrid.innerHTML = "";

      const slice = currentVisibleItems.slice(startIdx, endIdx);
      slice.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = `file-card${selectedSet.has(item.name) ? " selected" : ""}`;
        card.dataset.name = item.name;
        card.draggable = true;
        if (oldRects || total > 60) {
          card.style.animation = "none";
        } else {
          card.style.animationDelay = `${Math.min(i * 18, 140)}ms`;
        }
        card.innerHTML = `
          <div class="file-icon">${ICONS[item.type] || ICONS.file}</div>
          <div class="file-name">${item.name}</div>
          <div class="file-sub">${item.meta}</div>
        `;
        card.addEventListener("click", e => {
          if (e.shiftKey && lastAnchorName) {
            const names = currentVisibleItems.map(x => x.name);
            const a = names.indexOf(lastAnchorName);
            const b = names.indexOf(item.name);
            if (a !== -1 && b !== -1) {
              const [lo, hi] = a < b ? [a, b] : [b, a];
              if (!e.ctrlKey && !e.metaKey) selectedSet.clear();
              for (let k = lo; k <= hi; k++) selectedSet.add(names[k]);
            }
          } else if (e.ctrlKey || e.metaKey) {
            if (selectedSet.has(item.name)) selectedSet.delete(item.name);
            else selectedSet.add(item.name);
            lastAnchorName = item.name;
          } else {
            selectedSet.clear();
            selectedSet.add(item.name);
            lastAnchorName = item.name;
          }
          selectedName = selectedSet.size === 1 ? [...selectedSet][0] : null;
          document.querySelectorAll(".file-card").forEach(c =>
            c.classList.toggle("selected", selectedSet.has(c.dataset.name))
          );
          statusLeft.textContent = selectedSet.size > 1
            ? `Selected ${selectedSet.size} items (Ctrl/Shift+Click)`
            : `Selected: ${item.name} (${item.meta})`;
          updateActionBar();
        });
        card.addEventListener("contextmenu", e => {
          e.preventDefault();
          selectedName = item.name;
          document.querySelectorAll(".file-card").forEach(c => c.classList.toggle("selected", c === card));
          updateActionBar();
          openContextMenu(e.clientX, e.clientY, item);
        });
        card.addEventListener("dblclick", () => {
          if (item.type === "folder" && FS[item.name]) {
            navigateTo(item.name);
          } else if (item.type === "archive" || item.name.endsWith(".zip")) {
            openInArchiver(item);
          }
        });
        card.addEventListener("dragstart", e => {
          e.dataTransfer.setData("text/plain", item.name);
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "paithosh-drag-start", name: item.name }, "*");
          }
        });
        card.addEventListener("drag", e => {
          if (window.parent && window.parent !== window && e.clientY > 0) {
            window.parent.postMessage({ type: "paithosh-drag-near", near: e.clientY < 90 }, "*");
          }
        });
        card.addEventListener("dragend", () => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "paithosh-drag-end" }, "*");
          }
        });
        if (item.type === "folder") {
          card.addEventListener("dragover", e => {
            e.preventDefault();
            card.classList.add("drop-target");
          });
          card.addEventListener("dragleave", () => card.classList.remove("drop-target"));
          card.addEventListener("drop", e => {
            e.preventDefault();
            card.classList.remove("drop-target");
            const dragged = e.dataTransfer.getData("text/plain");
            if (dragged && dragged !== item.name) {
              moveItemWithAnim(dragged, item.name);
            }
          });
        }
        fileGrid.appendChild(card);
      });

      if (oldRects) animateFlip(oldRects);
    }

    function renderDir(dir, filter = "", clickedBtn = null, flipArg = false) {
      const preRects = flipArg instanceof Map ? flipArg : (flipArg ? captureRects() : null);
      currentVisibleItems = (FS[dir] || FS.Home).filter(item =>
        item.name.toLowerCase().includes(filter.toLowerCase())
      );
      if (!preRects) fileArea.scrollTop = 0;

      renderVirtualWindow(false, preRects);

      breadcrumb.innerHTML = formatBreadcrumb(getDirPath(dir));
      statusLeft.textContent = `${currentVisibleItems.length.toLocaleString()} items${currentVisibleItems.length > 100 ? " • Virtualized" : ""}`;

      const targetBtn = clickedBtn || document.querySelector(`.nav-item[data-dir="${dir}"]`);
      navItems.forEach(n => n.classList.toggle("active", n === targetBtn));
      if (!clickedBtn || !clickedBtn.classList.contains("tree-toggle")) {
        const group = targetBtn?.closest(".tree-group");
        if (group && !group.classList.contains("is-open")) {
          group.classList.add("is-open");
        }
      }
      trackIndicatorDuringTree(targetBtn);
    }

    fileArea.addEventListener("scroll", () => {
      renderVirtualWindow(false, null);
      if (currentVisibleItems.length > 50) {
        const { cols, rowH } = getVirtualMetrics();
        const firstIdx = Math.min(currentVisibleItems.length, Math.floor(fileArea.scrollTop / rowH) * cols + 1);
        scrollPill.textContent = `${firstIdx} / ${currentVisibleItems.length}`;
        scrollPill.classList.add("is-visible");
        clearTimeout(scrollPillTimer);
        scrollPillTimer = setTimeout(() => scrollPill.classList.remove("is-visible"), 800);
      }
    });

    window.addEventListener("resize", () => renderVirtualWindow(false, null));

    function removeItemsWithAnim(names) {
      const targetSet = new Set(names);
      if (targetSet.size === 0) return;

      const oldRects = captureRects();
      const isList = fileGrid.classList.contains("is-list");
      const ghosts = [];

      fileGrid.querySelectorAll(".file-card:not([data-ghost])").forEach((card, idx) => {
        if (!targetSet.has(card.dataset.name)) return;
        const r = card.getBoundingClientRect();
        const ghost = card.cloneNode(true);
        ghost.dataset.ghost = "true";
        ghost.style.position = "absolute";
        ghost.style.left = card.offsetLeft + "px";
        ghost.style.top = card.offsetTop + "px";
        ghost.style.width = r.width + "px";
        ghost.style.height = r.height + "px";
        ghost.style.margin = "0";
        ghost.style.pointerEvents = "none";
        ghost.style.zIndex = "1";
        ghost.style.animation = "none";
        ghost.style.transition = `opacity 0.22s ease ${Math.min(idx * 16, 80)}ms, transform 0.24s var(--smooth) ${Math.min(idx * 16, 80)}ms`;
        ghosts.push(ghost);
      });

      selectedSet.clear();
      selectedName = null;
      updateActionBar();
      FS[currentDir] = (FS[currentDir] || []).filter(i => !targetSet.has(i.name));
      renderDir(currentDir, searchInput.value, null, oldRects);

      ghosts.forEach(ghost => {
        fileGrid.appendChild(ghost);
        void ghost.offsetHeight;
        ghost.style.opacity = "0";
        ghost.style.transform = isList ? "scale(0.96)" : "scale(0.84)";
        setTimeout(() => ghost.remove(), 340);
      });
    }

    function removeItemWithAnim(name) {
      removeItemsWithAnim([name]);
    }

    let transferTimer = null;

    function triggerTransfer(label, sub) {
      const box = document.getElementById("transferBox");
      const lbl = document.getElementById("transferLabel");
      const pctEl = document.getElementById("transferPct");
      const fill = document.getElementById("transferFill");
      const subEl = document.getElementById("transferSub");
      if (!box) return;

      if (transferTimer) clearInterval(transferTimer);
      box.classList.remove("is-hidden");
      lbl.textContent = label;
      subEl.textContent = sub;
      let pct = 12;
      fill.style.width = pct + "%";
      pctEl.textContent = pct + "%";

      transferTimer = setInterval(() => {
        pct = Math.min(100, pct + 22);
        fill.style.width = pct + "%";
        pctEl.textContent = pct === 100 ? "Done" : pct + "%";
        if (pct >= 100) {
          clearInterval(transferTimer);
          setTimeout(() => box.classList.add("is-hidden"), 1400);
        }
      }, 220);
    }

    function moveItemsWithAnim(names, targetFolder) {
      const targetSet = new Set(names.filter(n => n !== targetFolder));
      if (targetSet.size === 0) return;
      const list = FS[currentDir] || [];
      list.forEach(item => {
        if (targetSet.has(item.name) && FS[targetFolder]) {
          FS[targetFolder].push(item);
        }
      });
      removeItemsWithAnim([...targetSet]);
      statusLeft.textContent = `Moved ${targetSet.size} item(s) → ${targetFolder}`;
      triggerTransfer(
        targetSet.size > 1 ? `Moving ${targetSet.size} items` : `Moving ${[...targetSet][0]}`,
        `To ~/${targetFolder} • 186 MB/s`
      );
    }

    function moveItemWithAnim(name, targetFolder) {
      moveItemsWithAnim([name], targetFolder);
    }

    function startRename(name) {
      const card = fileGrid.querySelector(`.file-card[data-name="${CSS.escape(name)}"]`);
      if (!card) return;
      const nameEl = card.querySelector(".file-name");
      const input = document.createElement("input");
      input.className = "rename-input";
      input.value = name;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        const next = input.value.trim() || name;
        const list = FS[currentDir] || [];
        const entry = list.find(i => i.name === name);
        if (entry) entry.name = next;
        list.sort((a, b) => (a.type === "folder" ? -1 : 1) - (b.type === "folder" ? -1 : 1) || a.name.localeCompare(b.name));
        selectedName = next;
        card.dataset.name = next;
        renderDir(currentDir, searchInput.value, null, true);
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") renderDir(currentDir, searchInput.value, null, false);
      });
      input.addEventListener("blur", commit);
    }

    const ctxMenu = document.getElementById("ctxMenu");
    const ctxArchive = document.getElementById("ctxArchive");
    const ctxUnzip = document.getElementById("ctxUnzip");

    function openContextMenu(x, y, item) {
      const isZip = item.name.endsWith(".zip") || item.type === "archive";
      ctxArchive.style.display = isZip ? "none" : "flex";
      ctxUnzip.style.display = isZip ? "flex" : "none";
      const maxX = window.innerWidth - 196;
      const maxY = window.innerHeight - 210;
      ctxMenu.style.left = Math.min(x, maxX) + "px";
      ctxMenu.style.top = Math.min(y, maxY) + "px";
      ctxMenu.classList.add("is-open");
    }

    function closeContextMenu() {
      ctxMenu.classList.remove("is-open");
    }

    function archiveItem(name) {
      const oldRects = captureRects();
      const list = FS[currentDir] || [];
      const zipName = name.replace(/\.[^.]+$/, "") + ".zip";
      if (!list.some(i => i.name === zipName)) {
        list.push({ name: zipName, type: "archive", meta: "Compressed • 1.8 MB" });
      }
      selectedName = zipName;
      renderDir(currentDir, searchInput.value, null, oldRects);
      statusLeft.textContent = `Archived → ${zipName}`;
      triggerTransfer(`Archiving ${name}`, `Creating ${zipName} • 94 MB/s`);
    }

    function unzipItem(name) {
      const oldRects = captureRects();
      const list = FS[currentDir] || [];
      const folderName = name.replace(/\.zip$/i, "") || "extracted";
      if (!list.some(i => i.name === folderName)) {
        list.unshift({ name: folderName, type: "folder", meta: "Extracted • 4 items" });
        FS[folderName] = [{ name: "README.md", type: "file", meta: "Extracted" }];
      }
      selectedName = folderName;
      renderDir(currentDir, searchInput.value, null, oldRects);
      statusLeft.textContent = `Unzipped → ${folderName}/`;
      triggerTransfer(`Extracting ${name}`, `Into ${folderName}/ • 128 MB/s`);
    }

    ctxMenu.addEventListener("click", e => {
      const btn = e.target.closest("[data-ctx]");
      if (!btn || !selectedName) return;
      const act = btn.dataset.ctx;
      closeContextMenu();
      if (act === "rename") startRename(selectedName);
      else if (act === "archive") archiveItem(selectedName);
      else if (act === "unzip") openPwdModal(selectedName);
      else if (act === "move" && selectedName !== "Dev") moveItemWithAnim(selectedName, "Dev");
      else if (act === "delete") removeItemWithAnim(selectedName);
    });

    window.addEventListener("click", e => {
      if (!ctxMenu.contains(e.target)) closeContextMenu();
    });

    document.getElementById("deleteBtn").addEventListener("click", () => {
      if (selectedSet.size > 0) removeItemsWithAnim([...selectedSet]);
    });
    document.getElementById("moveBtn").addEventListener("click", () => {
      if (selectedSet.size > 0) moveItemsWithAnim([...selectedSet], "Dev");
    });
    document.getElementById("renameBtn").addEventListener("click", () => {
      if (selectedName) startRename(selectedName);
    });

    window.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "l") {
        e.preventDefault();
        openPathEditor();
      } else if (e.key === "Delete" && selectedSet.size > 0) {
        removeItemsWithAnim([...selectedSet]);
      }
    });

    let activeArchiveName = null;

    function openInArchiver(item) {
      activeArchiveName = item.name;
      const bar = document.getElementById("archiverBar");
      document.getElementById("archiverTitle").textContent = `Archiver • ${item.name}`;
      document.getElementById("archiverSub").textContent = `4 compressed entries • ${item.meta} (57% ratio)`;
      bar.classList.add("is-open");

      currentVisibleItems = [
        { name: "OpenSans-Regular.ttf", type: "file", meta: "1.4 MB (compressed)" },
        { name: "OpenSans-SemiBold.ttf", type: "file", meta: "1.5 MB (compressed)" },
        { name: "OpenSans-Bold.ttf", type: "file", meta: "1.5 MB (compressed)" },
        { name: "OFL-LICENSE.txt", type: "file", meta: "4.2 KB (compressed)" }
      ];
      fileArea.scrollTop = 0;
      renderVirtualWindow(false, null);
      breadcrumb.innerHTML = `<span>~ › ${currentDir} › </span>${item.name}`;
      statusLeft.textContent = `Inspecting archive: ${item.name}`;
    }

    document.getElementById("archiverCloseBtn")?.addEventListener("click", () => {
      activeArchiveName = null;
      document.getElementById("archiverBar").classList.remove("is-open");
      renderDir(currentDir, searchInput.value);
    });

    let pendingExtractArchive = null;
    const pwdBackdrop = document.getElementById("pwdBackdrop");
    const pwdCard = document.getElementById("pwdCard");
    const pwdInput = document.getElementById("pwdInput");

    function openPwdModal(archiveName) {
      pendingExtractArchive = archiveName;
      document.getElementById("pwdDesc").textContent = `Enter password to unlock ${archiveName}:`;
      pwdInput.value = "";
      pwdInput.type = "password";
      pwdBackdrop.classList.add("is-open");
      setTimeout(() => pwdInput.focus(), 60);
    }

    function closePwdModal() {
      pwdBackdrop.classList.remove("is-open");
      pendingExtractArchive = null;
    }

    document.getElementById("pwdEyeBtn")?.addEventListener("click", () => {
      pwdInput.type = pwdInput.type === "password" ? "text" : "password";
    });

    document.getElementById("pwdCancelBtn")?.addEventListener("click", closePwdModal);
    pwdBackdrop?.addEventListener("click", e => { if (e.target === pwdBackdrop) closePwdModal(); });

    function submitPwdModal() {
      if (!pwdInput.value.trim()) {
        pwdCard.classList.remove("is-shake");
        void pwdCard.offsetWidth;
        pwdCard.classList.add("is-shake");
        return;
      }
      const target = pendingExtractArchive;
      closePwdModal();
      activeArchiveName = null;
      document.getElementById("archiverBar").classList.remove("is-open");
      unzipItem(target);
    }

    document.getElementById("pwdSubmitBtn")?.addEventListener("click", submitPwdModal);
    pwdInput?.addEventListener("keydown", e => {
      if (e.key === "Enter") submitPwdModal();
      if (e.key === "Escape") closePwdModal();
    });

    document.getElementById("archiverExtractBtn")?.addEventListener("click", () => {
      if (!activeArchiveName) return;
      openPwdModal(activeArchiveName);
    });

    function navigateTo(dir, push = true, clickedBtn = null) {
      activeArchiveName = null;
      document.getElementById("archiverBar")?.classList.remove("is-open");
      currentDir = dir;
      selectedSet.clear();
      selectedName = null;
      updateActionBar();
      if (push) {
        historyStack = historyStack.slice(0, historyIdx + 1);
        historyStack.push(dir);
        historyIdx = historyStack.length - 1;
      }
      renderDir(dir, searchInput.value, clickedBtn);
    }

    navItems.forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.classList.contains("tree-toggle")) {
          btn.closest(".tree-group").classList.toggle("is-open");
        }
        navigateTo(btn.dataset.dir, true, btn);
      });
    });

    document.querySelector(".profile")?.addEventListener("click", () => navigateTo("Home"));

    document.getElementById("backBtn").addEventListener("click", () => {
      if (historyIdx > 0) {
        historyIdx--;
        navigateTo(historyStack[historyIdx], false);
      }
    });

    document.getElementById("fwdBtn").addEventListener("click", () => {
      if (historyIdx < historyStack.length - 1) {
        historyIdx++;
        navigateTo(historyStack[historyIdx], false);
      }
    });

    document.getElementById("viewGridBtn").addEventListener("click", e => {
      const oldRects = captureRects();
      fileGrid.classList.remove("is-list");
      e.currentTarget.classList.add("active");
      document.getElementById("viewListBtn").classList.remove("active");
      renderVirtualWindow(false, oldRects);
    });

    document.getElementById("viewListBtn").addEventListener("click", e => {
      const oldRects = captureRects();
      fileGrid.classList.add("is-list");
      e.currentTarget.classList.add("active");
      document.getElementById("viewGridBtn").classList.remove("active");
      renderVirtualWindow(false, oldRects);
    });

    searchInput.addEventListener("input", () => renderDir(currentDir, searchInput.value));

    window.addEventListener("load", () => {
      if (window.self !== window.top) {
        document.querySelector(".search-box")?.style.setProperty("display", "none");
      }
      renderDir("Home");
    });

    // Download / Upload Location Picker Dialog
    const pickerBackdrop = document.getElementById("pickerBackdrop");
    const pickerList = document.getElementById("pickerList");
    const pickerPathInput = document.getElementById("pickerPathInput");
    const pickerNameInput = document.getElementById("pickerNameInput");
    const pickerTypeSelect = document.getElementById("pickerTypeSelect");
    const pickerConfirmBtn = document.getElementById("pickerConfirmBtn");
    const pickerModePill = document.getElementById("pickerModePill");
    const pickerTitle = document.getElementById("pickerTitle");

    let pickerMode = "upload";
    let pickerDir = "Home";

    const PICKER_PATHS = {
      Home: "/home/paithon/",
      Documents: "/home/paithon/Documents/",
      Dev: "/home/paithon/Dev/",
      Downloads: "/home/paithon/Downloads/",
      Music: "/home/paithon/Music/",
      Pictures: "/home/paithon/Pictures/",
      Root: "/"
    };

    function updatePickerConfirmState() {
      if (!pickerConfirmBtn || !pickerNameInput) return;
      pickerConfirmBtn.disabled = !pickerNameInput.value.trim();
    }

    function renderPickerDir(dirKey) {
      pickerDir = FS[dirKey] ? dirKey : "Home";
      if (pickerPathInput) pickerPathInput.value = PICKER_PATHS[pickerDir] || `/home/paithon/${pickerDir}/`;
      document.querySelectorAll(".picker-place").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.pdir === pickerDir);
      });
      const filterType = pickerTypeSelect?.value || "all";
      const items = (FS[pickerDir] || []).filter(item => {
        if (item.type === "folder" || filterType === "all") return true;
        return item.type === filterType;
      });
      if (!pickerList) return;
      pickerList.innerHTML = "";
      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "picker-row";
        const iconSvg = item.type === "folder" ? "📁" : item.type === "archive" ? "🗜" : "📄";
        row.innerHTML = `
          <div class="picker-row-name"><span>${iconSvg}</span><span>${item.name}</span></div>
          <span class="picker-row-meta">${item.meta}</span>
          <span class="picker-row-meta">${item.type}</span>
        `;
        row.addEventListener("click", () => {
          if (item.type === "folder") {
            if (FS[item.name]) renderPickerDir(item.name);
            return;
          }
          pickerList.querySelectorAll(".picker-row").forEach(r => r.classList.remove("selected"));
          row.classList.add("selected");
          if (pickerNameInput) pickerNameInput.value = item.name;
          updatePickerConfirmState();
        });
        row.addEventListener("dblclick", () => {
          if (item.type !== "folder" && pickerNameInput?.value.trim()) {
            confirmPicker();
          }
        });
        pickerList.appendChild(row);
      });
    }

    function openLocationPicker(mode) {
      pickerMode = mode;
      if (mode === "download") {
        if (pickerModePill) pickerModePill.textContent = "Download";
        if (pickerTitle) pickerTitle.textContent = "Save file to location";
        if (pickerConfirmBtn) pickerConfirmBtn.textContent = "✓ Save";
        if (pickerNameInput) pickerNameInput.value = "paithosh-theme-bundle.json";
        renderPickerDir("Downloads");
      } else {
        if (pickerModePill) pickerModePill.textContent = "Upload";
        if (pickerTitle) pickerTitle.textContent = "This page wants to open";
        if (pickerConfirmBtn) pickerConfirmBtn.textContent = "✓ Open";
        if (pickerNameInput) pickerNameInput.value = "";
        renderPickerDir(currentDir in FS ? currentDir : "Home");
      }
      updatePickerConfirmState();
      pickerBackdrop?.classList.add("is-open");
    }

    function closeLocationPicker() {
      pickerBackdrop?.classList.remove("is-open");
    }

    function confirmPicker() {
      const fileName = pickerNameInput?.value.trim();
      if (!fileName) return;
      const fullPath = `${pickerPathInput?.value || "/home/paithon/"}${fileName}`;
      const statusLeft = document.getElementById("statusLeft");
      if (statusLeft) {
        statusLeft.textContent = pickerMode === "download"
          ? `Saved → ${fullPath}`
          : `Selected → ${fullPath}`;
      }
      closeLocationPicker();
    }

    document.getElementById("pickerCloseBtn")?.addEventListener("click", closeLocationPicker);
    document.getElementById("pickerCancelBtn")?.addEventListener("click", closeLocationPicker);
    pickerConfirmBtn?.addEventListener("click", confirmPicker);
    pickerNameInput?.addEventListener("input", updatePickerConfirmState);
    pickerTypeSelect?.addEventListener("change", () => renderPickerDir(pickerDir));
    document.getElementById("pickerUpBtn")?.addEventListener("click", () => renderPickerDir("Home"));
    pickerBackdrop?.addEventListener("click", e => {
      if (e.target === pickerBackdrop) closeLocationPicker();
    });
    document.querySelectorAll(".picker-place").forEach(btn => {
      btn.addEventListener("click", () => renderPickerDir(btn.dataset.pdir));
    });
    pickerPathInput?.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const raw = pickerPathInput.value.replace(/\/+$/, "").split("/").pop();
        const match = Object.keys(FS).find(k => k.toLowerCase() === (raw || "").toLowerCase());
        renderPickerDir(match || "Home");
      }
    });

    window.addEventListener("message", e => {
      if (e.data?.type === "paithosh-search") {
        searchInput.value = e.data.query || "";
        renderDir(currentDir, searchInput.value);
      } else if (e.data?.type === "paithosh-theme") {
        const t = e.data;
        const root = document.documentElement.style;
        root.setProperty("--win-bg", t.bgBase);
        root.setProperty("--sidebar-bg", t.bgBase);
        root.setProperty("--text", t.textColor);
        root.setProperty("--text-sub", t.isLightText ? "rgba(255,255,255,0.62)" : "rgba(0,0,0,0.62)");
        root.setProperty("--card-bg", t.isLightText ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)");
        root.setProperty("--card-hover", t.isLightText ? "rgba(255,255,255,0.11)" : "rgba(0,0,0,0.11)");
        root.setProperty("--border", t.isLightText ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.14)");
        root.setProperty("--accent", t.isLightText ? "#ffffff" : "#000000");
        document.querySelectorAll(".icon-btn, .pill-btn, .nav-sub, .archiver-title").forEach(el => {
          el.style.color = t.textColor;
        });
      }
    });
  </script>
</body>
</html>
