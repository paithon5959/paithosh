# Paithosh Hyprland Integration Snippet
# Append or source this file in ~/.config/hypr/hyprland.conf

# Launch Paithosh Quickshell on startup
exec-once = quickshell -p /home/paithon/Projects/paithosh/shell

# Leave top gap so the floating Dynamic Island sits cleanly over gaps_out
general {
    gaps_in = 6
    gaps_out = 12
}

# Dynamic Island Shortcuts via Quickshell IPC
bind = CTRL, K, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh toggleSearch
bind = SUPER, Space, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh toggleLauncher
bind = SUPER, M, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh toggleDashboard mission
bind = SUPER, B, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh toggleHideBar

# Hardware Volume & Brightness Keys -> Inline Dynamic Island OSD
bindel = , XF86AudioRaiseVolume, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh adjustVolume 5
bindel = , XF86AudioLowerVolume, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh adjustVolume -5
bindel = , XF86MonBrightnessUp, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh adjustBrightness 8
bindel = , XF86MonBrightnessDown, exec, qs ipc -p /home/paithon/Projects/paithosh/shell call paithosh adjustBrightness -8
